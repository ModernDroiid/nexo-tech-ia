<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice">
<defs>
  <radialGradient id="vig" cx="50%" cy="50%" r="72%">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".7"/>
  </radialGradient>

  <linearGradient id="floor1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#17394a"/><stop offset="1" stop-color="#0c1f2a"/>
  </linearGradient>
  <radialGradient id="glow1" cx="50%" cy="8%" r="75%">
    <stop offset="0" stop-color="#6fd3e6" stop-opacity=".35"/>
    <stop offset="1" stop-color="#6fd3e6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient></defs>

<rect width="320" height="200" fill="#081620"/>
<!-- techo -->
<polygon points="0,0 320,0 215,48 105,48" fill="#0a1a25"/>
<polygon points="136,10 184,10 179,17 141,17" fill="#9be7f5" opacity=".85"/>
<polygon points="148,30 172,30 170,35 150,35" fill="#9be7f5" opacity=".7"/>
<!-- paredes laterales -->
<polygon points="0,0 105,48 105,140 0,200" fill="#0e2432"/>
<polygon points="320,0 215,48 215,140 320,200" fill="#0e2432"/>
<g stroke="#163646" stroke-width="1">
  <line x1="40" y1="18" x2="40" y2="177"/><line x1="75" y1="34" x2="75" y2="157"/>
  <line x1="280" y1="18" x2="280" y2="177"/><line x1="245" y1="34" x2="245" y2="157"/>
</g>
<!-- puerta lateral izquierda -->
<polygon points="48,48 68,56 68,151 48,162" fill="#0a1a24" stroke="#1d4656"/>
<circle cx="64" cy="106" r="1.5" fill="#4aa8bd"/>
<!-- pared del fondo con puerta de vidrio -->
<rect x="105" y="48" width="110" height="92" fill="#123041"/>
<rect x="138" y="66" width="44" height="74" fill="#0a1822" stroke="#24566a"/>
<rect x="143" y="71" width="16" height="64" fill="#2b6b80" opacity=".75"/>
<rect x="161" y="71" width="16" height="64" fill="#2b6b80" opacity=".75"/>
<line x1="145" y1="73" x2="155" y2="95" stroke="#8fdcec" stroke-width="1" opacity=".35"/>
<line x1="163" y1="73" x2="173" y2="95" stroke="#8fdcec" stroke-width="1" opacity=".35"/>
<rect x="150" y="54" width="20" height="7" rx="1" fill="#34d399" opacity=".8"/>
<!-- lector de acceso junto a la puerta -->
<rect x="188" y="96" width="6" height="10" rx="1" fill="#0a1822" stroke="#2f7d91"/>
<circle cx="191" cy="99" r="1" fill="#34d399"/>
<!-- piso -->
<polygon points="0,200 105,140 215,140 320,200" fill="url(#floor1)"/>
<g stroke="#1e4757" stroke-width=".8">
  <line x1="92.8" y1="147" x2="227.2" y2="147"/><line x1="73.5" y1="158" x2="246.5" y2="158"/><line x1="47.2" y1="173" x2="272.8" y2="173"/><line x1="10.5" y1="194" x2="309.5" y2="194"/>
  <line x1="133" y1="140" x2="75" y2="200"/><line x1="160" y1="140" x2="160" y2="200"/>
  <line x1="187" y1="140" x2="245" y2="200"/>
</g>
<ellipse cx="160" cy="150" rx="70" ry="10" fill="#6fd3e6" opacity=".08"/>
<rect width="320" height="200" fill="url(#glow1)"/>

<!-- persona caminando + detección -->
<g>
  <animateTransform attributeName="transform" type="translate"
    values="30 176; 290 176" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="10s" repeatCount="indefinite"/>
  <ellipse cx="0" cy="1" rx="16" ry="3.5" fill="url(#shadow)"/>
  <g fill="#3f8ea2">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-16 0 -30;16 0 -30;-16 0 -30" dur="1s" repeatCount="indefinite"/>
      <rect x="-3.2" y="-31" width="6" height="31" rx="2.6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="16 0 -30;-16 0 -30;16 0 -30" dur="1s" repeatCount="indefinite"/>
      <rect x="-3.2" y="-31" width="6" height="31" rx="2.6" fill="#357b8e"/>
    </g>
    <path d="M-10,-56 Q0,-61 10,-56 L11,-29 L-11,-29 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="12 0 -55;-12 0 -55;12 0 -55" dur="1s" repeatCount="indefinite"/>
      <rect x="-14" y="-56" width="5" height="26" rx="2.4" fill="#357b8e"/>
    </g>
    <circle cx="0" cy="-66" r="7.5"/>
  </g>
  
  <rect x="-20" y="-78" width="40" height="81" fill="none" stroke="#22d3ee" stroke-width="1.4" rx="1.5"/>
  <rect x="-20.7" y="-88" width="53.3" height="10" fill="#22d3ee" rx="1"/>
  <text x="-17.5" y="-80.7" font-size="7" font-family="JetBrains Mono, Consolas, monospace" font-weight="700" fill="#06121a">PERSONA 97%</text>
</g>

<rect width="320" height="200" fill="url(#vig)"/>
</svg>
